[project]
name = "ai-interview-platform"
version = "0.1.0"
description = "AI-powered Interview Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.12",
    "httpx[socks]>=0.28.0",
    "trafilatura>=2.0.0",
    "cryptography>=49.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.0.0",
    "charset-normalizer>=3.4.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "jinja2>=3.1.6",
    "playwright>=1.61.0",
    "pillow>=10.0.0",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
# 证件照美化依赖（体积大，可选安装；未安装时照片 API 返回 501）
imaging = [
    "opencv-python-headless>=4.10.0",
    "rembg>=2.0.60",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# 提示词为面向 LLM 的自然语言文本，位于字符串字面量内，不受行宽限制
"infrastructure/llm/prompts/*.py" = ["E501"]
# 参考简历模板为结构化的自然语言范本内容，位于字符串字面量内，不受行宽限制
"domain/resume_builder/reference_templates/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# celery 未提供类型存根（py.typed），忽略其导入未定义告警
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf (fitz) 无类型存根
module = ["fitz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# imaging 可选依赖（cv2/rembg 无类型存根；本地未安装 imaging 分组时跳过导入检查）
module = ["cv2", "cv2.*", "rembg", "rembg.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
